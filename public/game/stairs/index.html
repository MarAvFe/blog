<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stairs</title>
<meta name="description" content="Climb an endless staircase. Face the right way before you step, or fall." />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #111;
    overflow-x: hidden;
  }

  #stairs-game-wrap {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    max-width: 480px;
    margin: 1rem auto;
    padding: 0 0.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #stairs-canvas-area {
    position: relative;
    width: 100%;
  }

  #stairs-canvas {
    box-sizing: border-box;
    background: #e0e0e0;
    border: 2px solid #111;
    width: 100%;
    height: auto;
    display: block;
    touch-action: none;
  }

  #stairs-hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    font-family: monospace;
    font-size: 1rem;
    color: #fff;
  }

  #stairs-help {
    font-family: monospace;
    font-size: 0.85rem;
    text-align: center;
    opacity: 0.75;
    max-width: 480px;
    color: #fff;
  }

  #stairs-touch-controls {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 4%;
    display: flex;
    justify-content: center;
    gap: 4%;
    pointer-events: none;
  }

  .stairs-touch-btn {
    flex: 1;
    max-width: 42%;
    aspect-ratio: 1.6 / 1;
    background: rgba(17, 17, 17, 0.85);
    color: #fff;
    border: 3px solid #fff;
    border-radius: 12%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    padding: 0;
    pointer-events: auto;
  }

  .stairs-touch-btn svg {
    width: 45%;
    height: 45%;
    stroke: #fff;
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stairs-touch-btn:active {
    background: #fff;
  }

  .stairs-touch-btn:active svg {
    stroke: #111;
  }

  #stairs-gameover-restart {
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    font-family: monospace;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 0.75rem 2rem;
    background: rgba(17, 17, 17, 0.9);
    color: #fff;
    border: 3px solid #fff;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    display: none;
  }

  #stairs-gameover-restart:active {
    background: #fff;
    color: #111;
  }

  @media (min-width: 700px) {
    #stairs-touch-controls {
      display: none;
    }
  }
</style>
</head>
<body>

<div id="stairs-game-wrap">
  <div id="stairs-hud">
    <span>Score: <strong id="stairs-score">0</strong></span>
    <span>Coins: <strong id="stairs-coins">0</strong></span>
    <span>Best: <strong id="stairs-best">0</strong></span>
  </div>
  <div id="stairs-canvas-area">
    <canvas id="stairs-canvas" width="480" height="640"></canvas>

    <div id="stairs-touch-controls">
      <button id="stairs-touch-turn" class="stairs-touch-btn" type="button" aria-label="Turn and climb">
        <svg viewBox="0 0 24 24">
          <path d="M4 12a8 8 0 1 1 2.5 5.8" />
          <path d="M4 17v-5h5" />
        </svg>
      </button>
      <button id="stairs-touch-climb" class="stairs-touch-btn" type="button" aria-label="Climb straight">
        <svg viewBox="0 0 24 24">
          <path d="M12 19V5" />
          <path d="M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>

    <button id="stairs-gameover-restart" type="button">Restart</button>
  </div>

  <p id="stairs-help">
    <strong>A</strong> turn &amp; climb &nbsp;|&nbsp; <strong>D</strong> climb straight &nbsp;|&nbsp;
    match the next step's side before you commit.
  </p>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stairs-canvas");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("stairs-score");
  var bestEl = document.getElementById("stairs-best");
  var coinsEl = document.getElementById("stairs-coins");
  var touchControlsEl = document.getElementById("stairs-touch-controls");
  var touchTurnBtn = document.getElementById("stairs-touch-turn");
  var touchClimbBtn = document.getElementById("stairs-touch-climb");
  var gameoverRestartBtn = document.getElementById("stairs-gameover-restart");

  var CHUNK_SIZE = 1000;
  var GEN_THRESHOLD = 0.7;
  var STEP_HEIGHT = 64;
  var STEP_RUN = 90;
  var STEP_W = 70;
  var STEP_H = 40;
  var VISIBLE_ABOVE = 8;
  var VISIBLE_BELOW = 10;
  var BEST_KEY = "stairs_best_score";
  var COINS_KEY = "stairs_total_coins";

  var COIN_CHANCE = 0.1;
  var BIG_COIN_CHANCE = 0.1;
  var BIG_COIN_VALUE = 5;

  var STAIR_REPEAT_CHANCE = 0.7;

  var TIMER_DURATION_BREAKPOINTS = [
    { step: 0, duration: 12 },
    { step: 100, duration: 6 },
    { step: 200, duration: 4 },
    { step: 300, duration: 2 },
    { step: 400, duration: 1 }
  ];
  var TIMER_MIN_DURATION_S = 1;
  var TIMER_REFILL_RATIO = 0.1;
  var TIMER_START_RATIO = 0.5;
  var TIMER_BAR_Y = 50;
  var TIMER_BAR_HEIGHT = 30;
  var TIMER_BAR_WIDTH_RATIO = 0.5;

  function fullDurationAt(step) {
    var points = TIMER_DURATION_BREAKPOINTS;
    if (step <= points[0].step) return points[0].duration;
    for (var i = 1; i < points.length; i++) {
      if (step <= points[i].step) {
        var prev = points[i - 1];
        var next = points[i];
        var t = (step - prev.step) / (next.step - prev.step);
        return prev.duration + (next.duration - prev.duration) * t;
      }
    }
    return TIMER_MIN_DURATION_S;
  }

  var MAX_STREAK = 8;

  function pickNextDirection(prevDir) {
    if (prevDir === null) {
      currentStreakLength = 1;
      return Math.random() < 0.5 ? "left" : "right";
    }
    var forceFlip = currentStreakLength >= MAX_STREAK;
    var repeats = !forceFlip && Math.random() < STAIR_REPEAT_CHANCE;
    if (repeats) {
      currentStreakLength++;
      return prevDir;
    }
    currentStreakLength = 1;
    return prevDir === "left" ? "right" : "left";
  }

  var STEP_ANIM_MS = 90;
  var STAIR_SLIDE_FRAMES = 4;
  var JUMP_HEIGHT = 22;
  var BG_SCROLL_RATIO = 0.05;
  var FIGURE_SCALE = 1.3;

  var stairArray = [];
  var coinArray = [];
  var stepOffsetXCache = [];
  var lastGeneratedDir = null;
  var currentStreakLength = 0;
  var playerPosition = 0;
  var playerFacing = "right";
  var score = 0;
  var best = 0;
  var coins = 0;
  var gameState = "playing";
  var fallAngle = 0;
  var fallProgress = 0;
  var deathReason = "fall";

  var timeRemaining = 0;
  var lastTickAt = 0;
  var timerStarted = false;

  var stepAnimStart = 0;
  var stairSlideStart = 0;
  var stairSlideFromOffsetX = 0;
  var stairSlideToOffsetX = 0;

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(BEST_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(v) {
    try {
      localStorage.setItem(BEST_KEY, String(v));
    } catch (e) {
      /* ignore */
    }
  }

  function loadCoins() {
    try {
      var v = parseInt(localStorage.getItem(COINS_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) {
      return 0;
    }
  }

  function saveCoins(v) {
    try {
      localStorage.setItem(COINS_KEY, String(v));
    } catch (e) {
      /* ignore */
    }
  }

  function generateCoin() {
    if (Math.random() >= COIN_CHANCE) return "none";
    return Math.random() < BIG_COIN_CHANCE ? "big" : "small";
  }

  function generateChunk(length) {
    var dirs = [];
    var coinsOut = [];
    for (var i = 0; i < length; i++) {
      lastGeneratedDir = pickNextDirection(lastGeneratedDir);
      dirs.push(lastGeneratedDir);
      coinsOut.push(generateCoin());
    }
    return { dirs: dirs, coins: coinsOut };
  }

  function ensureStairs() {
    if (stairArray.length === 0) {
      var first = generateChunk(CHUNK_SIZE);
      stairArray = first.dirs;
      coinArray = first.coins;
      return;
    }
    var threshold = stairArray.length * GEN_THRESHOLD;
    if (playerPosition > threshold && stairArray.length - playerPosition < CHUNK_SIZE) {
      var next = generateChunk(CHUNK_SIZE);
      stairArray = stairArray.concat(next.dirs);
      coinArray = coinArray.concat(next.coins);
    }
  }

  function updateBest() {
    if (score > best) {
      best = score;
      saveBest(best);
    }
  }

  function refillTimer(atStep) {
    var full = fullDurationAt(atStep);
    timeRemaining = Math.min(full, timeRemaining + TIMER_REFILL_RATIO * full);
  }

  function resetGame() {
    updateBest();
    gameOverRendered = false;
    stairArray = [];
    coinArray = [];
    stepOffsetXCache = [];
    lastGeneratedDir = null;
    currentStreakLength = 0;
    playerPosition = 0;
    score = 0;
    gameState = "playing";
    fallAngle = 0;
    fallProgress = 0;
    deathReason = "fall";
    stepAnimStart = 0;
    stairSlideStart = 0;
    stairSlideFromOffsetX = 0;
    stairSlideToOffsetX = 0;
    timeRemaining = TIMER_START_RATIO * fullDurationAt(0);
    timerStarted = false;
    lastTickAt = performance.now();
    ensureStairs();
    playerFacing = stairArray[0];
    updateHud();
    updateControlsVisibility();
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
    coinsEl.textContent = String(coins);
  }

  function flipFacing() {
    if (gameState !== "playing") return;
    playerFacing = playerFacing === "left" ? "right" : "left";
  }

  function currentPlayerOffsetX() {
    return playerPosition === 0 ? 0 : stepOffsetX(playerPosition - 1);
  }

  function attemptClimb() {
    if (gameState !== "playing") return;
    ensureStairs();
    var nextDir = stairArray[playerPosition];
    if (nextDir === playerFacing) {
      var fromOffsetX = currentPlayerOffsetX();
      var landedCoin = coinArray[playerPosition];
      playerPosition++;
      score = playerPosition;
      timerStarted = true;
      updateBest();
      refillTimer(playerPosition);
      if (landedCoin === "small") {
        coins += 1;
        saveCoins(coins);
      } else if (landedCoin === "big") {
        coins += BIG_COIN_VALUE;
        saveCoins(coins);
      }
      ensureStairs();
      updateHud();

      var now = performance.now();
      stepAnimStart = now;
      stairSlideStart = now;
      stairSlideFromOffsetX = fromOffsetX;
      stairSlideToOffsetX = currentPlayerOffsetX();
    } else {
      var missedFromOffsetX = currentPlayerOffsetX();
      var missedToOffsetX = missedFromOffsetX + (playerFacing === "left" ? -STEP_RUN : STEP_RUN);
      startFall("fall", missedFromOffsetX, missedToOffsetX);
    }
  }

  function turnAndClimb() {
    if (gameState !== "playing") return;
    flipFacing();
    attemptClimb();
  }

  function startFall(reason, missedFromOffsetX, missedToOffsetX) {
    gameState = "falling";
    fallProgress = 0;
    fallAngle = playerFacing === "left" ? -1 : 1;
    deathReason = reason;
    if (missedToOffsetX !== undefined) {
      var now = performance.now();
      stepAnimStart = now;
      stairSlideStart = now;
      stairSlideFromOffsetX = missedFromOffsetX;
      stairSlideToOffsetX = missedToOffsetX;
    } else {
      stepAnimStart = 0;
      stairSlideStart = 0;
    }
  }

  var W = canvas.width;
  var H = canvas.height;
  var CENTER_X = W / 2;
  var FIGURE_LOCAL_FOOT_Y = 20;
  var FIGURE_GROUND_OVERLAP = 4;
  var STANDING_SURFACE_Y = H * 0.6;
  var PLAYER_Y = STANDING_SURFACE_Y + FIGURE_GROUND_OVERLAP - FIGURE_LOCAL_FOOT_Y * FIGURE_SCALE;

  function stepScreenY(index) {
    var offset = index - (playerPosition - 1);
    return STANDING_SURFACE_Y + STEP_H / 2 - offset * STEP_HEIGHT;
  }

  function stepOffsetX(index) {
    for (var i = stepOffsetXCache.length; i <= index; i++) {
      var prev = i === 0 ? 0 : stepOffsetXCache[i - 1];
      stepOffsetXCache[i] = prev + (stairArray[i] === "left" ? -STEP_RUN : STEP_RUN);
    }
    return stepOffsetXCache[index];
  }

  function drawStep(dir, x, y) {
    ctx.fillStyle = "#7b1330";
    ctx.fillRect(x - STEP_W / 2, y - STEP_H / 2, STEP_W, STEP_H);
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x - STEP_W / 2, y - STEP_H / 2, STEP_W, STEP_H);
  }

  function drawCoin(kind, x, y) {
    var r = kind === "big" ? 11 : 6;
    var coinY = y - STEP_H / 2 - r - 3;
    ctx.fillStyle = "#f2c200";
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, coinY, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  function animatedPlayerOffsetX() {
    var target = currentPlayerOffsetX();
    if (stairSlideStart === 0) return target;
    var t = (performance.now() - stairSlideStart) / STEP_ANIM_MS;
    if (t >= 1) return gameState === "falling" ? stairSlideToOffsetX : target;
    if (t < 0) t = 0;
    var steppedT = Math.floor(t * STAIR_SLIDE_FRAMES) / STAIR_SLIDE_FRAMES;
    return stairSlideFromOffsetX + (stairSlideToOffsetX - stairSlideFromOffsetX) * steppedT;
  }

  function animatedClimbY() {
    var climbed = playerPosition * STEP_HEIGHT;
    if (stairSlideStart === 0 || gameState === "falling") return climbed;
    var t = (performance.now() - stairSlideStart) / STEP_ANIM_MS;
    if (t >= 1) return climbed;
    if (t < 0) t = 0;
    var steppedT = Math.floor(t * STAIR_SLIDE_FRAMES) / STAIR_SLIDE_FRAMES;
    return climbed - STEP_HEIGHT * (1 - steppedT);
  }

  function drawStairs() {
    var lo = Math.max(0, playerPosition - VISIBLE_BELOW);
    var hi = playerPosition + VISIBLE_ABOVE;
    var playerOffsetX = animatedPlayerOffsetX();
    for (var i = lo; i < hi && i < stairArray.length; i++) {
      var y = stepScreenY(i);
      if (y < -STEP_HEIGHT || y > H + STEP_HEIGHT) continue;
      var x = CENTER_X + (stepOffsetX(i) - playerOffsetX);
      drawStep(stairArray[i], x, y);
      if (i >= playerPosition && coinArray[i] && coinArray[i] !== "none") {
        drawCoin(coinArray[i], x, y);
      }
    }
  }

  function stepAnimProgress() {
    if (stepAnimStart === 0) return 1;
    var t = (performance.now() - stepAnimStart) / STEP_ANIM_MS;
    if (t >= 1) return 1;
    return t < 0 ? 0 : t;
  }

  function drawStickFigure(x, y, facing, fallT) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(FIGURE_SCALE, FIGURE_SCALE);

    if (fallT > 0) {
      var angle = fallAngle * fallT * (Math.PI / 2.2);
      ctx.rotate(angle);
      ctx.translate(0, fallT * 40);
    }

    var dir = facing === "left" ? -1 : 1;

    var stepT = fallT > 0 ? 0 : stepAnimProgress();
    var lean = Math.sin(stepT * Math.PI);

    ctx.strokeStyle = "#111";
    ctx.fillStyle = "#111";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";

    var headR = 9;
    var headCY = -46;
    var torsoTopY = -37;
    var torsoBotY = -8;

    var leanX = dir * lean * 8;
    var leanRotate = dir * lean * 0.18;

    ctx.save();
    ctx.rotate(leanRotate);

    ctx.beginPath();
    ctx.arc(leanX, headCY, headR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(leanX + dir * (headR - 2), headCY, 1.6, 0, Math.PI * 2);
    ctx.fill();

    var capCY = headCY - 3;
    var capR = headR + 2;
    ctx.fillStyle = "#e8720c";
    ctx.beginPath();
    ctx.arc(leanX, capCY, capR, Math.PI, Math.PI * 2);
    ctx.fill();

    var brimLen = 15;
    var brimTipX = leanX + dir * (capR + brimLen);
    ctx.beginPath();
    ctx.moveTo(leanX - dir * 2, capCY - 1);
    ctx.lineTo(brimTipX, capCY - 1);
    ctx.lineTo(brimTipX, capCY + 3);
    ctx.lineTo(leanX + dir * (capR - 2), capCY + 3);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.moveTo(leanX, torsoTopY);
    ctx.lineTo(0, torsoBotY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(leanX, -30);
    ctx.lineTo(leanX + dir * -12, -16 + lean * 6);
    ctx.moveTo(leanX, -30);
    ctx.lineTo(leanX + dir * 14, -18 - lean * 4);
    ctx.stroke();

    ctx.restore();

    var backFootX = dir * (-6 - lean * 4);
    var frontFootX = dir * (12 + lean * 12);
    var backFootY = 20;
    var frontFootY = 20 - lean * 6;

    var backKneeX = backFootX * 0.5 - dir * lean * 6;
    var backKneeY = (torsoBotY + backFootY) * 0.5;
    var frontKneeX = frontFootX * 0.5 + dir * lean * 8;
    var frontKneeY = (torsoBotY + frontFootY) * 0.5;

    ctx.beginPath();
    ctx.moveTo(0, torsoBotY);
    ctx.lineTo(backKneeX, backKneeY);
    ctx.lineTo(backFootX, backFootY);
    ctx.moveTo(0, torsoBotY);
    ctx.lineTo(frontKneeX, frontKneeY);
    ctx.lineTo(frontFootX, frontFootY);
    ctx.stroke();

    ctx.fillStyle = "#1f5fd1";
    var shoeW = 9;
    var shoeH = 4;
    ctx.fillRect(backFootX - shoeW / 2 + dir * 2, backFootY - shoeH / 2, shoeW, shoeH);
    ctx.fillRect(frontFootX - shoeW / 2 + dir * 2, frontFootY - shoeH / 2, shoeW, shoeH);

    ctx.restore();
  }

  var SKY_COLOR = "#8fd3f4";
  var SEA_COLOR = "#2f7cc9";
  var SAND_COLOR = "#e8d29a";
  var CLOUD_SPACING = 220;
  var CLOUD_ROW_SPACING = 130;

  function drawCloud(x, y) {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.arc(x + 16, y - 6, 17, 0, Math.PI * 2);
    ctx.arc(x + 34, y, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSky(skyTop, skyBottom, bgScrollY) {
    ctx.fillStyle = SKY_COLOR;
    ctx.fillRect(0, skyTop, W, skyBottom - skyTop);

    var visibleTop = Math.max(skyTop, 0);
    var visibleBottom = Math.min(skyBottom, H);
    if (visibleBottom <= visibleTop) return;

    var rowOffset = bgScrollY % CLOUD_ROW_SPACING;
    var firstRow = Math.floor((visibleTop - 40 - skyTop + rowOffset) / CLOUD_ROW_SPACING) - 1;
    var lastRow = Math.ceil((visibleBottom + 20 - skyTop + rowOffset) / CLOUD_ROW_SPACING) + 1;
    for (var row = firstRow; row <= lastRow; row++) {
      var y = skyTop + row * CLOUD_ROW_SPACING - rowOffset + 40;
      if (y < visibleTop - 20 || y > visibleBottom + 20) continue;
      var colOffset = (row % 2 === 0) ? 0 : CLOUD_SPACING / 2;
      for (var col = -1; col * CLOUD_SPACING + colOffset < W + CLOUD_SPACING; col++) {
        drawCloud(col * CLOUD_SPACING + colOffset, y);
      }
    }
  }

  function drawIslandAndTree(x, y) {
    ctx.fillStyle = SAND_COLOR;
    ctx.beginPath();
    ctx.ellipse(x, y, 34, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#6b4423";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x + 4, y - 30);
    ctx.stroke();

    ctx.fillStyle = "#3f8f3f";
    ctx.beginPath();
    ctx.arc(x + 4, y - 34, 13, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSea(seaTop, seaBottom) {
    ctx.fillStyle = SEA_COLOR;
    ctx.fillRect(0, seaTop, W, seaBottom - seaTop);
    drawIslandAndTree(CENTER_X + 70, seaTop + (seaBottom - seaTop) * 0.55);
  }

  function drawCrab(x, y) {
    ctx.fillStyle = "#c1440e";
    ctx.beginPath();
    ctx.ellipse(x, y, 9, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#c1440e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 10, y - 4);
    ctx.lineTo(x - 15, y - 9);
    ctx.moveTo(x + 10, y - 4);
    ctx.lineTo(x + 15, y - 9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 7, y + 5);
    ctx.lineTo(x - 11, y + 9);
    ctx.moveTo(x - 2, y + 6);
    ctx.lineTo(x - 4, y + 10);
    ctx.moveTo(x + 2, y + 6);
    ctx.lineTo(x + 4, y + 10);
    ctx.moveTo(x + 7, y + 5);
    ctx.lineTo(x + 11, y + 9);
    ctx.stroke();
  }

  function drawSand(sandTop) {
    ctx.fillStyle = SAND_COLOR;
    ctx.fillRect(0, sandTop, W, H - sandTop);
    drawCrab(CENTER_X - 110, sandTop + (H - sandTop) * 0.5);
    drawCrab(CENTER_X + 130, sandTop + (H - sandTop) * 0.7);
  }

  function drawBackground() {
    var bgScrollY = animatedClimbY() * BG_SCROLL_RATIO;

    var sandTop = STANDING_SURFACE_Y - 20 + bgScrollY;
    var seaTop = STANDING_SURFACE_Y - H * 0.2 + bgScrollY;

    drawSky(-H, seaTop, bgScrollY);

    if (seaTop < H) {
      drawSea(Math.max(seaTop, -100), sandTop);
    }
    if (sandTop < H) {
      drawSand(sandTop);
    }
  }

  function drawGameOver() {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#111";
    ctx.textAlign = "center";
    ctx.font = "bold 28px monospace";
    ctx.fillText(deathReason === "timeout" ? "Time out!" : "You fell", CENTER_X, H / 2 - 40);
    ctx.font = "20px monospace";
    ctx.fillText("Score: " + score, CENTER_X, H / 2);
    ctx.font = "14px monospace";
    ctx.fillText("Press R or click Restart", CENTER_X, H / 2 + 30);
  }

  function render() {
    drawBackground();
    drawStairs();

    var fallT = gameState === "falling" ? Math.min(fallProgress / 30, 1) : 0;
    var jumpT = fallT > 0 ? 0 : stepAnimProgress();
    var jumpOffsetY = -4 * jumpT * (1 - jumpT) * JUMP_HEIGHT;
    drawStickFigure(CENTER_X, PLAYER_Y + jumpOffsetY, playerFacing, fallT);

    drawTimerBar();

    if (gameState === "gameover") {
      drawGameOver();
    }
  }

  var gameOverRendered = false;

  function updateTimer(now) {
    var deltaS = (now - lastTickAt) / 1000;
    lastTickAt = now;
    if (gameState !== "playing" || !timerStarted) return;
    timeRemaining -= deltaS;
    if (timeRemaining <= 0) {
      timeRemaining = 0;
      startFall("timeout");
    }
  }

  function timerRatio() {
    var full = fullDurationAt(playerPosition);
    return full > 0 ? Math.max(0, Math.min(1, timeRemaining / full)) : 0;
  }

  var TIMER_COLOR_GREEN = [46, 204, 64];
  var TIMER_COLOR_ORANGE = [255, 133, 27];
  var TIMER_COLOR_RED = [217, 30, 24];
  var TIMER_ORANGE_THRESHOLD = 0.49;
  var TIMER_RED_THRESHOLD = 0.2;

  function lerpColor(a, b, t) {
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bch = Math.round(a[2] + (b[2] - a[2]) * t);
    return "rgb(" + r + "," + g + "," + bch + ")";
  }

  function timerBarColor(ratio) {
    if (ratio >= TIMER_ORANGE_THRESHOLD) {
      var greenT = (1 - ratio) / (1 - TIMER_ORANGE_THRESHOLD);
      return lerpColor(TIMER_COLOR_GREEN, TIMER_COLOR_ORANGE, greenT);
    }
    if (ratio >= TIMER_RED_THRESHOLD) {
      var orangeT = (TIMER_ORANGE_THRESHOLD - ratio) / (TIMER_ORANGE_THRESHOLD - TIMER_RED_THRESHOLD);
      return lerpColor(TIMER_COLOR_ORANGE, TIMER_COLOR_RED, orangeT);
    }
    return "rgb(" + TIMER_COLOR_RED[0] + "," + TIMER_COLOR_RED[1] + "," + TIMER_COLOR_RED[2] + ")";
  }

  function drawTimerBar() {
    var barWidth = W * TIMER_BAR_WIDTH_RATIO;
    var barX = CENTER_X - barWidth / 2;
    var ratio = timerRatio();

    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.fillRect(barX, TIMER_BAR_Y, barWidth, TIMER_BAR_HEIGHT);

    ctx.fillStyle = timerBarColor(ratio);
    ctx.fillRect(barX, TIMER_BAR_Y, barWidth * ratio, TIMER_BAR_HEIGHT);

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(barX, TIMER_BAR_Y, barWidth, TIMER_BAR_HEIGHT);
  }

  function updateControlsVisibility() {
    var isGameOver = gameState === "gameover";
    touchControlsEl.style.display = isGameOver ? "none" : "";
    gameoverRestartBtn.style.display = isGameOver ? "block" : "none";
  }

  function tick(now) {
    updateTimer(now);
    if (gameState === "falling") {
      fallProgress++;
      if (fallProgress > 30) {
        gameState = "gameover";
        updateControlsVisibility();
      }
    }
    if (gameState !== "gameover" || !gameOverRendered) {
      render();
      gameOverRendered = gameState === "gameover";
    }
    requestAnimationFrame(tick);
  }

  function isEditableTarget(target) {
    if (!target) return false;
    var tag = target.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || target.isContentEditable;
  }

  window.addEventListener("keydown", function (e) {
    if (e.repeat || isEditableTarget(e.target)) return;
    var key = e.key.toLowerCase();
    if (key === "a") {
      turnAndClimb();
    } else if (key === "d") {
      attemptClimb();
    } else if (key === "r" && gameState === "gameover") {
      resetGame();
    } else {
      return;
    }
    e.preventDefault();
  });

  function bindTouchButton(el, action) {
    el.addEventListener("touchstart", function (e) {
      e.preventDefault();
      action();
    }, { passive: false });
    el.addEventListener("click", function (e) {
      e.preventDefault();
      action();
    });
  }

  bindTouchButton(gameoverRestartBtn, resetGame);

  bindTouchButton(touchTurnBtn, turnAndClimb);
  bindTouchButton(touchClimbBtn, attemptClimb);

  best = loadBest();
  coins = loadCoins();
  resetGame();
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
